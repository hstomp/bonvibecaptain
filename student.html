<html lang="nl">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#FFFFFF;color:#1E2D45;font-family:'Outfit',sans-serif;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:#F0F4FB;}
    ::-webkit-scrollbar-thumb{background:#1A4A8A;border-radius:2px;}
    input[type=range]{-webkit-appearance:none;appearance:none;background:#C0CCE0;border-radius:4px;height:6px;outline:none;width:100%;}

    input,textarea,select{color-scheme:light;}
    button{transition:all 0.18s;}
    #loading{position:fixed;inset:0;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;}
    #loading .spinner{font-size:40px;animation:spin 1s linear infinite;}
    #loading p{color:#5A7090;font-size:14px;}
    #err{display:none;position:fixed;inset:0;background:#FFFFFF;padding:40px;z-index:1000;}
    #err h2{color:#CC1111;margin-bottom:12px;}
    #err pre{color:#1E2D45;font-size:12px;background:#F0F4FB;padding:16px;border-radius:8px;overflow:auto;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</head>
